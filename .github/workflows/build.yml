name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build executable
        shell: cmd
        run: build.cmd

      - name: Verify executable
        shell: pwsh
        run: .\verify-build.ps1

      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash ChromeCertificatePolicyManager.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ChromeCertificatePolicyManager.exe" | Set-Content ChromeCertificatePolicyManager.exe.sha256 -Encoding ascii

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ChromeCertificatePolicyManager-${{ steps.version.outputs.value }}
          path: |
            ChromeCertificatePolicyManager.exe
            ChromeCertificatePolicyManager.exe.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Validate tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -ne "v${{ needs.build.outputs.version }}") {
            throw "Tag $env:GITHUB_REF_NAME does not match VERSION ${{ needs.build.outputs.version }}."
          }

      - name: Download executable
        uses: actions/download-artifact@v4
        with:
          name: ChromeCertificatePolicyManager-${{ needs.build.outputs.version }}
          path: release

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            release/ChromeCertificatePolicyManager.exe `
            release/ChromeCertificatePolicyManager.exe.sha256 `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --generate-notes `
            --title $env:GITHUB_REF_NAME
