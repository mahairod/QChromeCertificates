name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build executable
        working-directory: ChromeCertificatePolicyManager
        shell: cmd
        run: build.cmd

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ChromeCertificatePolicyManager
          path: ChromeCertificatePolicyManager/ChromeCertificatePolicyManager.exe
          if-no-files-found: error
