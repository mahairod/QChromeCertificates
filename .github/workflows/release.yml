name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release v3.0"
        required: true
        type: string

env:
  QT_VERSION:     "6.8.0"
  BUILD_TYPE:      Release

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      distdir: ${{ github.workspace }}/build/dist

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following 3 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator>
      # 3. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      matrix:
        os: [ubuntu-latest, windows-2022, macos-15]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-2022
            c_compiler: cl
            cpp_compiler: cl
            qtplatform: windows
            qt_arch: win64_msvc2022_64
            artifact: windows-x64
            packer: NSIS
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            qtplatform: linux
            qt_arch: linux_gcc_64
            artifact: linux-x64
            packer: DEB
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
            qtplatform: linux
            qt_arch: linux_gcc_64
            artifact: linux-x64
            packer: DEB
          - os: macos-15
            c_compiler: clang
            cpp_compiler: clang++
            qtplatform: mac
            qt_arch: clang_64
            artifact: macos
            packer: DragNDrop
        exclude:
          - os: windows-2022
            c_compiler: gcc
          - os: windows-2022
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl
          - os: macos-15
            c_compiler: cl
          - os: macos-15
            c_compiler: gcc

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: ${{ matrix.qtplatform }}
        target: desktop
        arch: ${{ matrix.qt_arch }}
        cache: true
        dir: "${{github.workspace}}/qt"
        install-deps: "true"

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_PREFIX_PATH=${{github.workspace}}/qt
        -S ${{ github.workspace }}

    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --parallel

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest --build-config ${{ matrix.build_type }}

    - name: Install
      run: cmake --install build --config ${{ env.BUILD_TYPE }} --prefix package

    - name: Package
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: |
        cpack -G ${{ matrix.packer }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      env:
        distdir: ${{ steps.strings.outputs.build-output-dir }}/dist
      with:
        name: ${{ matrix.artifact }}
        if-no-files-found: error
        path: |
          ${{ env.distdir }}/*.exe
          ${{ env.distdir }}/*.zip
          ${{ env.distdir }}/*.deb
          ${{ env.distdir }}/*.dmg
          ${{ env.distdir }}/*.rpm
          ${{ env.distdir }}/*.tgz

    - name: Upload signatures
      uses: actions/upload-artifact@v4
      env:
        distdir: ${{ steps.strings.outputs.build-output-dir }}/dist
      with:
        name: "${{ matrix.artifact }}-signature"
        path: ${{ env.distdir }}/*.sha*

    - name: Upload logs
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: "${{ matrix.artifact }}-logs"
        path: ${{ steps.strings.outputs.build-output-dir }}

  # ==========================================================
  # GitHub Release
  # ==========================================================
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: List release files
        run: |
          find release -type f -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            release/**/*.exe
            release/**/*.zip
            release/**/*.deb
            release/**/*.dmg
            release/**/*.rpm
            release/**/*.tgz          
          generate_release_notes: true
